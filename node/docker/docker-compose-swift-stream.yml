version: '3.5'

services:
  swift-stream:
    container_name: etny-swift-stream
    # quay.io/minio/minio:RELEASE.2023-03-13T19-46-17Z, mirrored on 2026-10-13
    # (image id c69ff79d5831): quay.io answers 401 to an anonymous pull of
    # that tag, and the mirror is pulled without credentials.
    image: registry.ethernity.cloud:443/debuggingdelight/ethernity-cloud-sdk-registry/minio/minio:RELEASE.2023-03-13T19-46-17Z
    command: server /data/
    expose:
      - "9000"
    ports:
      - "127.0.0.1:9000:9000"
    # The node's root credential (store_access.root_credential), which the
    # agent puts in the environment of each run of this compose. A run
    # without the two variables fails: MinIO starts no server under its
    # built-in root.
    environment:
      MINIO_ROOT_USER: ${ECLD_STORE_ROOT_USER:?unset}
      MINIO_ROOT_PASSWORD: ${ECLD_STORE_ROOT_PASSWORD:?unset}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ethernity
    volumes:
      - ./etny-swift-stream-data:/data

networks:
  ethernity:
    name: ethernity
    driver: bridge
